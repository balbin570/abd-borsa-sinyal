name: Overnight Telegram pre-close
on:
  schedule:
    # UTC windows cover 15:00 New York in both EDT and EST.
    - cron: '0,5,10 19,20 * * 1-5'
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call overnight endpoint (NY-time guarded)
        env:
          CRON_KEY: ${{ secrets.OVERNIGHT_CRON_KEY }}
        run: |
          curl --fail --show-error --silent --max-time 25 \
            -X POST -H "X-Automation-Key: $CRON_KEY" \
            'https://abd-borsa-sinyal.onrender.com/overnight/run'
