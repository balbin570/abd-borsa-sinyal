name: C2 Forward Validation

on:
  workflow_dispatch:

  schedule:
    # 23:00 UTC = Türkiye 02:00
    # Existing Telegram scan runs earlier,
    # so Twelve Data requests do not overlap.
    - cron: "0 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: c2-forward-validation
  cancel-in-progress: false

jobs:
  forward-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx==0.28.1

      - name: Run C2 forward validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python scripts/update_forward_validation.py

      - name: Show result
        run: |
          python - <<'PY'
          import json

          with open(
              "data/forward_validation.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Market date:",
              data.get(
                  "last_successful_scan_market_date"
              )
          )

          print(
              "Official forward signals:",
              data.get(
                  "official_forward_signal_count",
                  0
              )
          )

          print(
              "Bootstrap signals:",
              data.get(
                  "bootstrap_signal_count",
                  0
              )
          )
          PY

      - name: Commit forward validation data
        run: |
          if git diff --quiet -- data/forward_validation.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/forward_validation.json
          git commit -m "Update C2 forward validation"
          git push
