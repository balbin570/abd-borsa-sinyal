name: US Paper - indicative intraday portfolio
on:
  workflow_dispatch:
  schedule:
    # During US regular market hours in both EST and EDT (UTC).
    - cron: '*/30 14-21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: us-paper-indicative-quote
  cancel-in-progress: true
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market quote dependency
        run: python -m pip install --quiet yfinance
      - name: Read-only indicative portfolio snapshot
        run: python paper_portfolio/quote_snapshot.py
