name: Fiyat alarmi (Telegram)
on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Test mesaji gonder'
        type: boolean
        default: true
  schedule:
    # Hafta ici, Londra seansi boyunca 2 saatte bir (UTC)
    - cron: '23 8-16/2 * * 1-5'
permissions:
  contents: write
concurrency:
  group: price-alert
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance requests
      - name: Alarm kontrolu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: |
          if [ "$IS_TEST" = "true" ]; then python scripts/price_alert_telegram.py --test
          else python scripts/price_alert_telegram.py; fi
      - name: Durumu kaydet
        if: always()
        run: |
          [ -d price_alerts ] || exit 0
          git add price_alerts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Price alert state"
          for i in 1 2 3 4; do
            git fetch origin main && git rebase origin/main || { git rebase --abort; exit 1; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
