name: US Top5 Telegram monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 13-21 * * 1-5'
    - cron: '15,45 22,23,0,1,2,3,4 * * 1-6'
permissions:
  contents: write
concurrency:
  group: us-top5-telegram-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance requests exchange-calendars
      - name: Telegram monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_portfolio/telegram_monitor.py
      - name: Persist notification deduplication
        if: always()
        run: |
          if [ ! -f paper_portfolio/telegram_monitor_state.json ]; then exit 0; fi
          git add paper_portfolio/telegram_monitor_state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist Telegram notification state"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
