name: US RS Breakout - volume threshold comparison
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/us-rs-volume-threshold-comparison.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public screener and price support
        run: |
          git clone --depth 1 https://github.com/KarneeshkarV/screener.git external-screener
          python -m pip install --quiet './external-screener[prices]'
      - name: Compare volume thresholds on latest completed US session
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, math, os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          import pandas as pd
          from screener.backtester.data import build_price_fetcher
          from screener.rs_breakout import fetch_price_data, normalize_bars, build_signal_frame
          symbols="AAPL MSFT NVDA AMZN GOOGL META TSLA AMD AVGO NFLX CRM ORCL PLTR UBER COIN HOOD JPM V MA COST".split()
          ny=datetime.now(ZoneInfo("America/New_York"))
          as_of=ny.date()
          if ny.hour < 17:
              as_of-=timedelta(days=1)
          while as_of.weekday()>=5:
              as_of-=timedelta(days=1)
          fetcher=build_price_fetcher(refresh=True)
          bars,bench=fetch_price_data(symbols,"us",as_of,fetcher,benchmark="SPY",history_days=220,max_workers=4)
          spy=normalize_bars(bench,as_of)
          if len(spy)<60:raise RuntimeError("SPY benchmark history insufficient")
          rows=[]
          for symbol in symbols:
              frame=normalize_bars(bars.get(symbol,pd.DataFrame()),as_of)
              row={"symbol":symbol,"last_bar":"","bars":len(frame),"rs55":None,"volume_ratio":None,"close":None,"supertrend":None,"previous_week_high":None,"rs_pass":False,"trend_pass":False,"breakout_pass":False,"vol_1_5":False,"vol_1_2":False,"vol_1_0":False,"full_1_5":False,"full_1_2":False,"full_1_0":False,"status":"OK"}
              if len(frame)<60:row["status"]="INSUFFICIENT_DATA"
              else:
                  try:
                      p=build_signal_frame(frame,spy["close"],require_delivery=False)
                      last=p.iloc[-1]
                      def val(k):
                          v=last.get(k)
                          try:
                              n=float(v)
                              return round(n,5) if math.isfinite(n) else None
                          except (TypeError,ValueError):return None
                      row.update(last_bar=str(p.index[-1].date()),rs55=val("rs_55"),volume_ratio=val("volume_ratio"),close=val("close"),supertrend=val("supertrend_value"),previous_week_high=val("previous_week_high"))
                      row["rs_pass"]=row["rs55"] is not None and row["rs55"]>0
                      row["trend_pass"]=row["close"] is not None and row["supertrend"] is not None and row["close"]>row["supertrend"]
                      row["breakout_pass"]=row["close"] is not None and row["previous_week_high"] is not None and row["close"]>row["previous_week_high"]
                      for threshold,suffix in ((1.5,"1_5"),(1.2,"1_2"),(1.0,"1_0")):
                          row["vol_"+suffix]=row["volume_ratio"] is not None and row["volume_ratio"]>=threshold
                          row["full_"+suffix]=row["rs_pass"] and row["trend_pass"] and row["breakout_pass"] and row["vol_"+suffix]
                      if any(row[k] is None for k in ("rs55","volume_ratio","supertrend")):row["status"]="INDICATOR_MISSING"
                  except Exception as e:row["status"]=f"ERROR {type(e).__name__}: {str(e)[:80]}"
              rows.append(row)
              print(f"{symbol}: {row['status']}; date={row['last_bar']}; volume={row['volume_ratio']}; 1.5={row['full_1_5']} 1.2={row['full_1_2']} 1.0={row['full_1_0']}",flush=True)
          with open("volume_threshold_comparison.json","w") as f:json.dump({"as_of":str(as_of),"benchmark":"SPY","rows":rows},f,indent=2)
          with open("volume_threshold_comparison.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          lines=["## RS Breakout volume threshold comparison","",f"Data cutoff: {as_of} (New York) | SPY benchmark | paper-only, no orders","", "| Ticker | Last bar | RS55 | Trend | Breakout | Vol ratio | >=1.5 | >=1.2 | >=1.0 |","|---|---|---|---|---|---:|---|---|---|"]
          def yn(v):return "YES" if v else "-"
          for r in rows:
              lines.append(f"| {r['symbol']} | {r['last_bar'] or r['status']} | {yn(r['rs_pass'])} | {yn(r['trend_pass'])} | {yn(r['breakout_pass'])} | {r['volume_ratio']} | {yn(r['full_1_5'])} | {yn(r['full_1_2'])} | {yn(r['full_1_0'])} |")
          lines+=["","### Full entry counts",""]
          for suffix in ("1_5","1_2","1_0"):
              selected=[r["symbol"] for r in rows if r["full_"+suffix]]
              lines.append(f"- Volume >= {suffix.replace('_','.')}: {len(selected)}/20 ({', '.join(selected) or 'none'})")
          lines+=["","This compares signal counts, not profitability. No strategy thresholds were changed."]
          report="\n".join(lines)+"\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(report)
          if sum(r["status"]=="OK" for r in rows)<15:raise RuntimeError("Insufficient valid stocks for comparison")
          PY
      - name: Upload comparison data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-rs-volume-comparison
          path: |
            volume_threshold_comparison.json
            volume_threshold_comparison.csv
          if-no-files-found: warn
          retention-days: 30
