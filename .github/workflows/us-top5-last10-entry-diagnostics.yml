name: US TOP5 B125 Last 10 Entry Diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          git clone --depth 1 https://github.com/KarneeshkarV/screener.git external-screener
          python -m pip install './external-screener[prices]' yfinance pandas requests lxml html5lib
      - name: Diagnose last ten entry signal days
        run: python -m research.us_top5_last10_entry_diagnostics
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top5-b125-last10-entry-diagnostics
          path: |
            research/us_top5_6m/last10_entry_diagnostics.md
            research/us_top5_6m/last10_entry_diagnostics.json
          if-no-files-found: warn
          retention-days: 30
