name: US TOP5 Early Loss Diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/KarneeshkarV/screener.git external-screener
          python -m pip install './external-screener[prices]' yfinance pandas requests lxml html5lib
      - name: Generate baseline trade ledger
        run: python -m research.us_top5_6m_backtest
      - name: Analyze first three trading days
        run: python -m research.us_top5_early_loss_diagnostics
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top5-early-loss-diagnostics
          path: |
            research/us_top5_6m/early_loss_diagnostics.md
            research/us_top5_6m/early_loss_diagnostics.json
          if-no-files-found: warn
          retention-days: 30
