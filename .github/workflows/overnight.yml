name: Overnight V3 direct GitHub Actions

on:
  schedule:
    # UTC; Python checks America/New_York to handle daylight saving time.
    - cron: '40 17,18 * * 1-5'  # 13:40 NY (EDT/EST)
    - cron: '5,10 19,20 * * 1-5'  # final NY 15:05 / 15:10
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        type: choice
        default: telegram-test
        options:
          - telegram-test
          - prescreen
          - final

permissions:
  contents: read

concurrency:
  group: overnight-v3-direct
  cancel-in-progress: false

jobs:
  overnight:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select mode using NY clock
        id: choose
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/New_York'))
          minute = now.hour * 60 + now.minute
          mode = ''
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              mode = os.environ['MANUAL_ACTION']
          elif now.weekday() < 5:
              if 13*60+40 <= minute <= 14*60+10:
                  mode = 'prescreen'
              elif 15*60+5 <= minute <= 15*60+20:
                  mode = 'final'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'mode={mode}\n')
          print('New York:', now.isoformat(), 'mode:', mode or 'skip')
          PY
      - name: Run existing Overnight V3 directly
        if: steps.choose.outputs.mode != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ steps.choose.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            python scripts/overnight_actions.py "$MODE" --manual
          else
            python scripts/overnight_actions.py "$MODE"
          fi
