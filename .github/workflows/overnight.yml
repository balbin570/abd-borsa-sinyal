name: Overnight V3 direct GitHub Actions

on:
  schedule:
    # Prescreen: NY 13:40, yaz ve kis saati
    - cron: '40 17 * * 1-5'
    - cron: '40 18 * * 1-5'

    # Final: NY 15:05, yaz ve kis saati
    - cron: '5 19 * * 1-5'
    - cron: '5 20 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        type: choice
        default: telegram-test
        options:
          - telegram-test
          - prescreen
          - final

permissions:
  contents: read

concurrency:
  group: overnight-v3-direct
  cancel-in-progress: false

jobs:
  overnight:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select mode using NY clock
        id: choose
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/New_York'))
          print('SCHEDULE_TRIGGER:', os.environ.get('GITHUB_EVENT_SCHEDULE', 'manual'), flush=True)
          minute = now.hour * 60 + now.minute
          mode = ''
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              mode = os.environ['MANUAL_ACTION']
          elif os.environ['EVENT_NAME'] == 'schedule':
              trigger = os.environ.get('GITHUB_EVENT_SCHEDULE', '')
              winter = now.utcoffset().total_seconds() == -5 * 3600
              expected_hour = 18 if winter else 17
              if trigger == f'40 {expected_hour} * * 1-5':
                  mode = 'prescreen'
              elif trigger == f'5 {expected_hour + 2} * * 1-5':
                  mode = 'final'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'mode={mode}\n')
          print('New York:', now.isoformat(), 'mode:', mode or 'skip')
          PY
      - name: Run existing Overnight V3 directly
        if: steps.choose.outputs.mode != ''
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ steps.choose.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            python scripts/overnight_actions.py "$MODE" --manual
          else
            python scripts/overnight_actions.py "$MODE"
          fi
