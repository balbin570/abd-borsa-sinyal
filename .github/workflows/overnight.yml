
name: Overnight Telegram pre-close

on:
  schedule:
    # UTC windows cover 15:00 New York in both EDT and EST.
    - cron: '0,5,10 19,20 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual action'
        required: true
        default: 'telegram-test'
        type: choice
        options:
          - telegram-test
          - overnight-run

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call overnight endpoint
        env:
          CRON_KEY: ${{ secrets.OVERNIGHT_CRON_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_ACTION" = "telegram-test" ]; then
            URL='https://abd-borsa-sinyal-eplj.onrender.com/overnight/test-telegram'
          else
            URL='https://abd-borsa-sinyal-eplj.onrender.com/overnight/run'
          fi
          curl --fail --show-error --silent --max-time 25 \
            -X POST -H "X-Automation-Key: $CRON_KEY" \
            "$URL"
