name: SWING-15 backtest (RSI / EMA / Bollinger / kırılım)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy requests lxml html5lib
      - name: Backtest
        run: python -m research.swing15_backtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing15-backtest
          path: research/swing15/report.md
          retention-days: 30
