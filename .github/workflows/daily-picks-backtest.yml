name: Gunluk secim backtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy requests lxml html5lib
      - name: Backtest
        run: python -u -m research.daily_picks_backtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-picks-backtest
          path: research/daily_picks/report.md
          retention-days: 30
