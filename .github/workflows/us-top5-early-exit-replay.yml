name: US TOP5 Early Exit Portfolio Replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/KarneeshkarV/screener.git external-screener
          python -m pip install './external-screener[prices]' yfinance pandas requests lxml html5lib
      - name: Compare early-loss exits against original V1 and V2
        run: python -m research.us_top5_early_exit_replay
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top5-early-exit-replay
          path: |
            research/us_top5_6m/early_exit_replay.md
            research/us_top5_6m/early_exit_replay.json
          if-no-files-found: warn
          retention-days: 30
