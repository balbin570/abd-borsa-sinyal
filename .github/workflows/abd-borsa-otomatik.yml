
name: ABD Borsa Otomatik Tarama

on:
  schedule:
    # UTC saatleri; New York yaz/kis saatleri
    - cron: "45 17 * * 1-5"
    - cron: "5 19 * * 1-5"
    - cron: "45 18 * * 1-5"
    - cron: "5 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abd-borsa-otomatik
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Taramayi calistir
        env:
          CRON_KEY: ${{ secrets.OVERNIGHT_CRON_KEY }}
          BASE_URL: https://abd-borsa-sinyal-eplj.onrender.com
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ny = datetime.now(ZoneInfo("America/New_York"))
          print("New York:", ny.isoformat())

          if ny.weekday() >= 5:
              print("Hafta sonu; islem yok.")
              raise SystemExit(0)

          minute = ny.hour * 60 + ny.minute
          if 13*60+40 <= minute <= 14*60:
              endpoint = "/overnight/prescreen/run"
          elif 15*60 <= minute <= 15*60+12:
              endpoint = "/overnight/run"
          else:
              print("Calisma penceresi disinda.")
              raise SystemExit(0)

          key = os.environ.get("CRON_KEY", "")
          if not key:
              raise RuntimeError(
                  "OVERNIGHT_CRON_KEY GitHub Secret eksik"
              )

          url = os.environ["BASE_URL"] + endpoint
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url,
                      data=b"",
                      headers={
                          "X-Automation-Key": key,
                          "Content-Type": "application/json"
                      },
                      method="POST"
                  )
                  with urllib.request.urlopen(
                      request, timeout=60
                  ) as response:
                      status = response.status
                      print("HTTP:", status)
                      if status not in (200, 202, 204):
                          raise RuntimeError(
                              f"Beklenmeyen HTTP {status}"
                          )
                  print("Tetikleme basarili:", endpoint)
                  break
              except Exception as exc:
                  print("Deneme", attempt, "hatasi:", exc)
                  if attempt == 3:
                      raise
                  time.sleep(20)
          PY
