
name: ABD Borsa Otomatik Tarama

on:
  schedule:
    - cron: "*/10 17-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abd-borsa-otomatik
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tarama ve durum kontrolu
        env:
          CRON_KEY: ${{ secrets.OVERNIGHT_CRON_KEY }}
          BASE_URL: https://abd-borsa-sinyal-eplj.onrender.com
        run: |
          python3 - <<'PY'
          import os
          import time
          import json
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ny = datetime.now(ZoneInfo("America/New_York"))
          print("New York:", ny.isoformat())

          if ny.weekday() >= 5:
              raise SystemExit(0)

          minute = ny.hour * 60 + ny.minute
          if 13*60+45 <= minute <= 14*60+50:
              endpoint = "/overnight/prescreen/run"
          elif 15*60+5 <= minute <= 15*60+50:
              endpoint = "/overnight/run"
          else:
              print("Calisma penceresi disinda.")
              raise SystemExit(0)

          key = os.environ.get("CRON_KEY")
          if not key:
              raise RuntimeError("GitHub secret eksik")

          url = os.environ["BASE_URL"] + endpoint
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url,
                      data=b"",
                      headers={"X-Automation-Key": key},
                      method="POST"
                  )
                  with urllib.request.urlopen(
                      request, timeout=45
                  ) as response:
                      print("HTTP:", response.status)
                      if response.status not in (200, 202, 204):
                          raise RuntimeError("Beklenmeyen yanit")
                  print("Tetikleme basarili:", endpoint)
                  break
              except Exception as exc:
                  print("Deneme:", attempt, str(exc))
                  if attempt == 3:
                      raise
                  time.sleep(15)

          status_path = (
              "/overnight/prescreen/status"
              if "prescreen" in endpoint
              else "/overnight/status"
          )
          with urllib.request.urlopen(
              os.environ["BASE_URL"] + status_path,
              timeout=30
          ) as response:
              result = json.load(response)
          print("Durum:", json.dumps(result, ensure_ascii=False)[:1500])
          PY
