name: US TOP5 Original vs B125 MOM20 - Last 10 Sessions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          git clone --depth 1 https://github.com/KarneeshkarV/screener.git external-screener
          python -m pip install './external-screener[prices]' yfinance pandas requests lxml html5lib
      - name: Compare last ten completed SPY sessions
        run: python -m research.us_top5_last10_comparison
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top5-last10-original-vs-b125
          path: |
            research/us_top5_6m/last10_comparison.md
            research/us_top5_6m/last10_comparison.json
          if-no-files-found: warn
