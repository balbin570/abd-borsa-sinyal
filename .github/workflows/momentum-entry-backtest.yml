name: Giris testi: hacim + yukselis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas numpy requests lxml html5lib
      - name: Backtest
        run: python -u -m research.momentum_entry_backtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-entry-backtest
          path: research/momentum_entry/report.md
          retention-days: 30
