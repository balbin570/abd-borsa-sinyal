name: US TOP5 D2-LOSS2 Breakout Refinement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          git clone --depth 1 https://github.com/KarneeshkarV/screener.git external-screener
          python -m pip install './external-screener[prices]' yfinance pandas requests lxml html5lib
      - name: Compare breakout thresholds and three-month windows
        run: python -m research.us_top5_entry_refinement
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top5-d2-loss2-entry-refinement
          path: |
            research/us_top5_6m/entry_refinement.md
            research/us_top5_6m/entry_refinement.json
          if-no-files-found: warn
          retention-days: 30
