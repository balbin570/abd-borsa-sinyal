name: US TOP5 V2 independent paper
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: us-top5-v2-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market data dependencies
        run: pip install pandas yfinance
      - name: Run independent V2 forward paper
        run: python paper_portfolio_v2/top5_v2.py
      - name: Commit V2 ledger only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_portfolio_v2/state.json paper_portfolio_v2/latest_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Update US TOP5 V2 forward paper ledger"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
