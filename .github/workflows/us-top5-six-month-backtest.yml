name: US TOP5 V1 vs V2 - 6 Month Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/KarneeshkarV/screener.git external-screener
          python -m pip install './external-screener[prices]' yfinance pandas requests lxml html5lib
      - name: Run read-only 6-month backtest
        run: python -m research.us_top5_6m_backtest
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top5-six-month-backtest
          path: |
            research/us_top5_6m/report.md
            research/us_top5_6m/result.json
          if-no-files-found: warn
          retention-days: 30
